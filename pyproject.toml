[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mamg"
version = "0.1.0"
description = "Missingness-Aware Multimodal Gating for skin lesion classification (Team 26PB67, MSRUAS)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
